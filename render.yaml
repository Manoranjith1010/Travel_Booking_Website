services:
  - type: web
    name: travel-booking-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://travel-booking-client.onrender.com

  - type: web
    name: travel-booking-client
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://travel-booking-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
